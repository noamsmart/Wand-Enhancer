# Temporary workflow used only for this build.
name: ChatGPT Build WandEnhancer EXE

on:
  push:
    branches:
      - chatgpt-build-exe
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 10.17.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-panel/pnpm-lock.yaml

      - name: Build unsigned executable
        shell: pwsh
        run: ./build.ps1 -Configuration Release

      - name: Upload executable
        uses: actions/upload-artifact@v6
        with:
          name: WandEnhancer-unsigned
          path: WandEnhancer/bin/Release/WandEnhancer.exe
          if-no-files-found: error

      - name: Publish executable to output branch
        shell: pwsh
        run: |
          $builtExe = Join-Path $env:GITHUB_WORKSPACE 'WandEnhancer/bin/Release/WandEnhancer.exe'
          $tempExe = Join-Path $env:RUNNER_TEMP 'WandEnhancer.exe'
          Copy-Item $builtExe $tempExe -Force

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin chatgpt-build-output
          git checkout -B chatgpt-build-output origin/chatgpt-build-output

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item $tempExe 'dist/WandEnhancer.exe' -Force
          git add -f dist/WandEnhancer.exe
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'Executable is unchanged; nothing to publish.'
            exit 0
          }

          git commit -m 'build: publish WandEnhancer.exe'
          git push origin chatgpt-build-output
